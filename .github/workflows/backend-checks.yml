name: FORGE backend and frontend checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [security/forge-ai-reliability]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: find backend -name '*.js' -not -path '*/node_modules/*' -exec node --check {} +
      - run: node --test backend/tests/*.test.cjs
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci
      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-lockfile
          path: package-lock.json
      - run: npm run build
        env:
          CI: 'false'
